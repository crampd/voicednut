name: Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  validate-miniapp:
    name: Validate Mini App
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: miniapp

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: miniapp/package-lock.json

      - name: Install Mini App dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate Mini App contracts, lint, and build
        run: npm run validate:prod

  deploy:
    name: Deploy via SSH to EC2
    runs-on: ubuntu-latest
    needs: validate-miniapp
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Deploy using SSH
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          timeout: 30m
          command_timeout: 30m
          script: |
            bash <<'EOF'
            set -euo pipefail

            export NVM_DIR="/home/ubuntu/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
              nvm use 20 >/dev/null 2>&1 || nvm use default >/dev/null 2>&1 || true
            fi

            for required_command in git node npm pm2; do
              if ! command -v "$required_command" >/dev/null 2>&1; then
                echo "Missing required command: $required_command" >&2
                exit 1
              fi
            done

            DEPLOY_ROOT=/home/ubuntu/voxly
            REPO_URL=https://github.com/crampd/voicednut.git
            LOG_ROOT="$DEPLOY_ROOT/logs"

            mkdir -p "$DEPLOY_ROOT"

            if [ ! -d "$DEPLOY_ROOT/.git" ]; then
              git clone --filter=blob:none --no-checkout "$REPO_URL" "$DEPLOY_ROOT"
            fi

            cd "$DEPLOY_ROOT"
            git sparse-checkout init --cone
            git sparse-checkout set api bot

            git fetch --depth=1 origin "${{ github.sha }}"
            git checkout --force "${{ github.sha }}"
            git clean -fd api bot

            mkdir -p "$LOG_ROOT/api" "$LOG_ROOT/bot"

            # Reset PM2 to a known-empty state without failing when nothing is running.
            pm2 delete all || true
            pm2 kill || true

            # Deploy API
            cd "$DEPLOY_ROOT/api"
            npm ci --omit=dev --no-audit --no-fund
            npm run parity:providers
            pm2 startOrRestart ecosystem.config.js --env production

            # Deploy Bot
            cd "$DEPLOY_ROOT/bot"
            npm ci --omit=dev --no-audit --no-fund
            pm2 startOrRestart ecosystem.config.js --env production

            # Save PM2 process list
            pm2 status
            pm2 save --force
            EOF
