name: Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy via SSH to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy using SSH
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail

            # Ensure PM2 is available in non-interactive SSH shell
            export PATH=$PATH:/home/ubuntu/.nvm/versions/node/v20.20.0/bin

            DEPLOY_ROOT=/home/ubuntu/voxly
            REPO_URL=https://github.com/voxsprint/voicednut.git

            mkdir -p "$DEPLOY_ROOT"

            if [ ! -d "$DEPLOY_ROOT/.git" ]; then
              git clone --filter=blob:none --no-checkout "$REPO_URL" "$DEPLOY_ROOT"
              cd "$DEPLOY_ROOT"
              git sparse-checkout init --cone
              git sparse-checkout set api bot
            else
              cd "$DEPLOY_ROOT"
            fi

            git fetch --depth=1 origin "${{ github.sha }}"
            git checkout --force "${{ github.sha }}"
            git clean -fd api bot

            # Reset PM2 to a known-empty state without failing when nothing is running.
            pm2 delete all || true
            pm2 kill || true

            # Deploy API
            cd "$DEPLOY_ROOT/api"
            npm install
            npm run parity:providers
            pm2 startOrRestart ecosystem.config.js --env production

            # Deploy Bot
            cd "$DEPLOY_ROOT/bot"
            npm install
            pm2 startOrRestart ecosystem.config.js --env production

            # Save PM2 process list
            pm2 save
